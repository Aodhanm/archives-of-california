<title>Manuscript chart. ✎✓ RE-READ AT FULL RESOLUTION 2026-09-24 (n21). Title verbatim: **'Plano del Puerto del **Cap.n** Bodega descubierto con la Goleta "Sonora" el día **23 de Obre**'** — ✎ the port is named for the CAPTAIN (matching AGI MP-MEXICO,582, 'Plano del puerto del Capitán Bodega'), and the date is 23 October, not 3 October. Scale line: 'Desde la punta del Cordon á la de Munguia, **1 Legua**. Idem idem á la de las Arenas, **300 varas**.' Points lettered: **Punta de Munguia** (W, with **El farallon del Padre Sierra** off it), **Punta de las Arenas**, **Punta del Cordón** (a long spit running NW–SE), **Barras de arena**, **Campo verde** (NE). ⭐⭐ The enclosed water is labelled **'Mar ó Río'** — in 1775 the surveyors did not establish whether it was sea or river. Notes verbatim: 'La punta del Cordon esta situada bajo la latitud de **38° 18'**.' · 'La bahía de la boca coje desde la punta del Cordon á la punta de Arenas, y rompe á veces, sin embargo que tiene mucho fonda por la canal y fuera de ella.' · 'Entre la punta de Munguia y punta del Cordon es la entrada del puerto de mas **25 brazas de agua**.' ⚠ **Which bay this is, is an open question.** Tovell identifies Punta del Cordón and Punta de las Arenas as Tomales Bluff and Sand Point, which would make the 1775 'Puerto del Capitán Bodega' **Tomales Bay**, not Bodega Bay; Zayas letters the name at Bodega Bay in 1793. The 1 legua / 300 varas / 38°18' figures on this leaf are the hard constraints for testing any identification. Labeled 'Provincial State Papers, Benicia, Miscellaneous, 1770–1821'. Orig. pag. 465.</p>
