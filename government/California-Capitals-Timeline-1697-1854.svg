<text x="1499" y="236" font-size="10.5" fill="#555" text-anchor="end">1852 session already here ·</text>
<rect x="1507" y="268" width="59" height="20" rx="4" fill="#36454f"/><text x="1574" y="282" font-size="11" fill="#333">1852–53</text>
